name: CI/CD - AssistaJunto

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dotnet:
    name: Validate .NET API
    uses: ./.github/workflows/dotnet-validation.yml

  ci:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Compose environment for validation
        run: cp .env.example .env

      - name: Set up Node for container checks
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build validation
        env:
          ACME_EMAIL: ci@example.com
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: docker compose -p assistajunto-ci -f docker-compose.yml build --pull api client pipocabot

      - name: Validate React container
        env:
          REACT_TEST_IMAGE: assistajunto-ci-client
        run: node --test tests/docker/react-container.test.mjs

  cd:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci, dotnet]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml up -d --build --remove-orphans --wait --wait-timeout 120
            docker image prune -f
