name: .NET API validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Restore, build and test .NET API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore src/AssistaJunto.API/AssistaJunto.API.csproj
      - name: Build API and backend projects
        run: dotnet build src/AssistaJunto.API/AssistaJunto.API.csproj --configuration Release --no-restore

      - name: Restore .NET tests
        run: dotnet restore tests/AssistaJunto.Tests/AssistaJunto.Tests.csproj
      - name: Build .NET tests
        run: dotnet build tests/AssistaJunto.Tests/AssistaJunto.Tests.csproj --configuration Release --no-restore
      - name: Run .NET unit and integration tests
        run: dotnet test tests/AssistaJunto.Tests/AssistaJunto.Tests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/dotnet-tests
